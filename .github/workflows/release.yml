name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

env:
  NPM_VERSION: "11.18.0"
  MDVE_SOURCE_VISIBILITY: public

jobs:
  publish:
    name: Verify and publish the tagged candidate
    runs-on: ubuntu-latest
    environment: npm-release
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.11.0"
          registry-url: https://registry.npmjs.org

      - name: Install and verify pinned npm
        run: bash .github/scripts/install-pinned-npm.sh

      - name: Install dependencies
        run: npm ci

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox

      - name: Run release gates available in CI
        run: |
          npm test
          node --test scripts/check-release-owner-evidence.test.mjs
          npm run typecheck
          npm run build
          npm audit --omit=dev --audit-level=high
          npm run verify:licenses
          npm run test:reliability
          MDVE_STABILITY_OUTPUT=release/stability npm run test:release:stability

      - name: Install exact supported Codex CLI
        run: npm install --prefix "$RUNNER_TEMP/codex" @openai/codex@0.146.0

      - name: Generate and validate Codex protocol artifacts
        env:
          MDVE_CODEX_BIN: ${{ runner.temp }}/codex/node_modules/.bin/codex
          MDVE_CODEX_SCHEMA_OUTPUT: test-results/codex-schema.json
        run: npm run test:codex:schema

      - name: Build and inspect exact npm candidate
        run: |
          mkdir -p release
          npm pack --pack-destination release --json
          VERSION=$(node -p "require('./package.json').version")
          npm run verify:artifact -- "release/mdve-${VERSION}.tgz"

      - name: Verify release-owner evidence before publication
        env:
          MDVE_RELEASE_OWNER_EVIDENCE: ${{ secrets.MDVE_RELEASE_OWNER_EVIDENCE }}
        run: |
          if [[ -z "$MDVE_RELEASE_OWNER_EVIDENCE" ]]; then
            echo '::error::The npm-release environment must provide MDVE_RELEASE_OWNER_EVIDENCE before publication.'
            exit 1
          fi
          printf '%s' "$MDVE_RELEASE_OWNER_EVIDENCE" > "$RUNNER_TEMP/mdve-release-owner-evidence.json"
          node scripts/check-release-owner-evidence.mjs "$RUNNER_TEMP/mdve-release-owner-evidence.json"

      - name: Run packaged process-crash recovery matrix
        run: |
          VERSION=$(node -p "require('./package.json').version")
          MDVE_E2E_ARCHIVE="release/mdve-${VERSION}.tgz" MDVE_PROCESS_CRASH_OUTPUT="release/process-crash.json" npm run test:process-crash

      - name: Run packaged browser and accessibility tests
        run: |
          VERSION=$(node -p "require('./package.json').version")
          MDVE_E2E_ARCHIVE="release/mdve-${VERSION}.tgz" npm run test:e2e:installed

      - name: Run packaged performance matrix
        run: |
          VERSION=$(node -p "require('./package.json').version")
          MDVE_E2E_ARCHIVE="release/mdve-${VERSION}.tgz" MDVE_PERFORMANCE_OUTPUT="release/performance.json" npm run test:performance:installed
          cat release/performance.json

      - name: Run packaged install lifecycle matrix
        run: |
          VERSION=$(node -p "require('./package.json').version")
          MDVE_E2E_ARCHIVE="release/mdve-${VERSION}.tgz" MDVE_LIFECYCLE_OUTPUT="release/lifecycle.json" npm run test:install:lifecycle

      - name: Write release evidence manifest
        env:
          MDVE_RELEASE_OWNER_EVIDENCE_PATH: ${{ runner.temp }}/mdve-release-owner-evidence.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          MDVE_PERFORMANCE_OUTPUT="release/performance.json" MDVE_STABILITY_SUMMARY="release/stability/summary.json" MDVE_LIFECYCLE_OUTPUT="release/lifecycle.json" MDVE_PROCESS_CRASH_OUTPUT="release/process-crash.json" MDVE_CODEX_SCHEMA_OUTPUT="test-results/codex-schema.json" MDVE_CODEX_BIN="$RUNNER_TEMP/codex/node_modules/.bin/codex" node scripts/write-release-evidence.mjs "release/mdve-${VERSION}.tgz" release/evidence.json

      - name: Publish the immutable candidate under the next tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          npm publish "release/mdve-${VERSION}.tgz" --access public --tag next

      - name: Verify the registry candidate and signatures
        run: |
          VERSION=$(node -p "require('./package.json').version")
          npm run verify:registry -- "release/mdve-${VERSION}.tgz" release/registry.json

      - name: Refresh release evidence after registry verification
        env:
          MDVE_TRUSTED_PUBLISHER: npm trusted publishing via GitHub Actions OIDC; registry integrity and signatures verified
          MDVE_RELEASE_OWNER_EVIDENCE_PATH: ${{ runner.temp }}/mdve-release-owner-evidence.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          MDVE_PERFORMANCE_OUTPUT="release/performance.json" MDVE_STABILITY_SUMMARY="release/stability/summary.json" MDVE_LIFECYCLE_OUTPUT="release/lifecycle.json" MDVE_PROCESS_CRASH_OUTPUT="release/process-crash.json" MDVE_CODEX_SCHEMA_OUTPUT="test-results/codex-schema.json" MDVE_CODEX_BIN="$RUNNER_TEMP/codex/node_modules/.bin/codex" MDVE_REGISTRY_EVIDENCE="release/registry.json" node scripts/write-release-evidence.mjs "release/mdve-${VERSION}.tgz" release/evidence.json

      - name: Upload release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mdve-${{ github.ref_name }}-release-evidence
          path: |
            release/
            release/stability/
            test-results/codex-schema.json
          if-no-files-found: error

      - name: Record stable-promotion boundary
        run: echo "Candidate verified and published as next; promoting latest remains an explicit maintainer action after legal approval."
