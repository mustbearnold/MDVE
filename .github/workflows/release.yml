name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

env:
  NPM_VERSION: "11.18.0"

jobs:
  publish:
    name: Verify and publish the tagged candidate
    runs-on: ubuntu-latest
    environment: npm-release
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47fe5020 # v7.0.0
        with:
          node-version: "22.11.0"
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install and verify pinned npm
        run: bash .github/scripts/install-pinned-npm.sh

      - name: Install dependencies
        run: npm ci

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox

      - name: Run release gates available in CI
        run: |
          npm test
          npm run typecheck
          npm run build
          npm audit --omit=dev --audit-level=high
          npm run verify:licenses
          npm run test:reliability
          npm run test:release:stability

      - name: Build and inspect exact npm candidate
        run: |
          mkdir -p release
          npm pack --pack-destination release --json
          VERSION=$(node -p "require('./package.json').version")
          npm run verify:artifact -- "release/mdve-${VERSION}.tgz"

      - name: Run packaged browser and accessibility tests
        run: |
          VERSION=$(node -p "require('./package.json').version")
          MDVE_E2E_ARCHIVE="release/mdve-${VERSION}.tgz" npm run test:e2e:installed

      - name: Run packaged performance matrix
        run: |
          VERSION=$(node -p "require('./package.json').version")
          MDVE_E2E_ARCHIVE="release/mdve-${VERSION}.tgz" MDVE_PERFORMANCE_OUTPUT="release/performance.json" npm run test:performance:installed
          cat release/performance.json

      - name: Run packaged install lifecycle matrix
        run: |
          VERSION=$(node -p "require('./package.json').version")
          MDVE_E2E_ARCHIVE="release/mdve-${VERSION}.tgz" npm run test:install:lifecycle

      - name: Write release evidence manifest
        run: |
          VERSION=$(node -p "require('./package.json').version")
          MDVE_PERFORMANCE_OUTPUT="release/performance.json" MDVE_STABILITY_SUMMARY="test-results/release-stability/summary.json" node scripts/write-release-evidence.mjs "release/mdve-${VERSION}.tgz" release/evidence.json

      - name: Upload release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mdve-${{ github.ref_name }}-release-evidence
          path: |
            release/
            test-results/release-stability/
          if-no-files-found: error

      - name: Publish through npm trusted publishing
        run: |
          VERSION=$(node -p "require('./package.json').version")
          npm publish "release/mdve-${VERSION}.tgz" --access public --provenance
