name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  NPM_VERSION: "11.18.0"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - "22.11.0"
          - "22.x"
          - "24.11.0"
          - "24.x"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install and verify pinned npm
        run: bash .github/scripts/install-pinned-npm.sh

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build production assets
        run: npm run build

      - name: Verify npm artifact allowlist and bundle budget
        run: npm run verify:artifact

  fedora:
    name: Fedora 44 runtime
    runs-on: ubuntu-latest
    container: fedora:44
    timeout-minutes: 15
    steps:
      - name: Install Fedora build prerequisites
        run: dnf install -y ca-certificates curl git-core gzip make tar which xz

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.11.0"
          cache: npm

      - name: Install and verify pinned npm
        run: bash .github/scripts/install-pinned-npm.sh

      - name: Install dependencies
        run: npm ci

      - name: Run Fedora unit and contract tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build production assets
        run: npm run build

      - name: Verify npm artifact allowlist and bundle budget
        run: npm run verify:artifact

  security:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.x"
          cache: npm

      - name: Install and verify pinned npm
        run: bash .github/scripts/install-pinned-npm.sh

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify production license metadata
        run: npm run verify:licenses

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  browser:
    name: Packaged browser and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.11.0"
          cache: npm

      - name: Install and verify pinned npm
        run: bash .github/scripts/install-pinned-npm.sh

      - name: Install dependencies
        run: npm ci

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox

      - name: Build production assets
        run: npm run build

      - name: Run packaged browser and accessibility tests
        run: npm run test:e2e:installed

      - name: Run installed performance matrix
        run: npm run test:performance:installed

      - name: Print performance evidence
        run: cat test-results/performance.json

  reliability:
    name: Reliability soak
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.11.0"
          cache: npm

      - name: Install and verify pinned npm
        run: bash .github/scripts/install-pinned-npm.sh

      - name: Install dependencies
        run: npm ci

      - name: Run deterministic reliability soak
        run: npm run test:reliability

  crash-recovery:
    name: Process crash recovery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.11.0"
          cache: npm

      - name: Install and verify pinned npm
        run: bash .github/scripts/install-pinned-npm.sh

      - name: Install dependencies
        run: npm ci

      - name: Run Linux subprocess crash matrix
        run: npm run test:process-crash

      - name: Print crash recovery evidence
        run: cat test-results/process-crash.json

  codex-schema:
    name: Codex app-server schema contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.11.0"
          cache: npm

      - name: Install and verify pinned npm
        run: bash .github/scripts/install-pinned-npm.sh

      - name: Install project dependencies
        run: npm ci

      - name: Install exact supported Codex CLI
        run: npm install --prefix "$RUNNER_TEMP/codex" @openai/codex@0.146.0

      - name: Generate and validate Codex protocol artifacts
        env:
          MDVE_CODEX_BIN: ${{ runner.temp }}/codex/node_modules/.bin/codex
          MDVE_CODEX_SCHEMA_OUTPUT: test-results/codex-schema.json
        run: npm run test:codex:schema

      - name: Print Codex schema evidence
        run: cat test-results/codex-schema.json

  lifecycle:
    name: Install lifecycle (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - "22.11.0"
          - "24.11.0"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install and verify pinned npm
        run: bash .github/scripts/install-pinned-npm.sh

      - name: Install dependencies
        run: npm ci

      - name: Run installed lifecycle checks
        run: npm run test:install:lifecycle

  validate:
    name: validate
    if: always()
    needs:
      - quality
      - security
      - dependency-review
      - browser
      - reliability
      - crash-recovery
      - codex-schema
      - lifecycle
      - fedora
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required CI jobs
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          RELIABILITY_RESULT: ${{ needs.reliability.result }}
          CRASH_RECOVERY_RESULT: ${{ needs.crash-recovery.result }}
          CODEX_SCHEMA_RESULT: ${{ needs.codex-schema.result }}
          LIFECYCLE_RESULT: ${{ needs.lifecycle.result }}
          FEDORA_RESULT: ${{ needs.fedora.result }}
        run: |
          test "${QUALITY_RESULT}" = "success"
          test "${SECURITY_RESULT}" = "success"
          test "${BROWSER_RESULT}" = "success"
          test "${RELIABILITY_RESULT}" = "success"
          test "${CRASH_RECOVERY_RESULT}" = "success"
          test "${CODEX_SCHEMA_RESULT}" = "success"
          test "${LIFECYCLE_RESULT}" = "success"
          test "${FEDORA_RESULT}" = "success"
          case "${DEPENDENCY_REVIEW_RESULT}" in
            success|skipped) ;;
            *) exit 1 ;;
          esac
